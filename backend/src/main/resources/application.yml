# =============================
#  HTTPS 設定
# =============================
server:
  port: 8443
  ssl:
    key-store: classpath:keystore.p12
    key-store-password: 123456
    key-store-type: PKCS12
    key-alias: myssl

# =============================
#  資料庫連線（MySQL）
# =============================
spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  thymeleaf:
    check-template-location: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/banking-system

  datasource:
    url: jdbc:mysql://localhost:3306/bankdb?useSSL=false&serverTimezone=Asia/Taipei&useLegacyDatetimeCode=false&allowPublicKeyRetrieval=true
    username: root
    password: root1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  application:
    name: banking-backend

# =============================
#  日誌等級與檔案路徑
# =============================
logging:
  level:
    root: INFO
  file:
    name: logs/app.log

# =============================
#  MyBatis 設定
# =============================
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.bankdb.entity
  type-handlers-package: com.example.bankdb.handler

# =============================
#  JWT 設定
# =============================
jwt:
  secret: ${JWT_SECRET:Hiu452XBYl8qN3wh11OnHLiO-uqYXlcVhDNeHLAIPLE}
  expiration-time-seconds: ${EXPIRATION_SECONDS:3600}
