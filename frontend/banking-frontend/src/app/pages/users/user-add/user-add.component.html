<div class="flex flex-col items-center justify-center p-6 bg-gray-50 min-h-full">

    <div class="w-full max-w-lg p-8 space-y-6 bg-white rounded-xl shadow-2xl">

        <h1 class="text-3xl font-extrabold text-gray-900 text-center border-b pb-4">
            註冊使用者
        </h1>

        <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="space-y-5">

            <div>
                <label for="userName" class="block text-sm font-medium text-gray-700 mb-1">使用者帳號</label>
                <input id="userName" formControlName="userName" placeholder="請輸入獨特的帳號名稱"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out">
            </div>

            <div>
                <label for="passwordHash" class="block text-sm font-medium text-gray-700 mb-1">使用者密碼</label>
                <input type="password" id="passwordHash" formControlName="passwordHash" placeholder="至少 8 位字元"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out">
            </div>

            <div>
                <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">姓名</label>
                <input id="fullName" formControlName="fullName" placeholder="請輸入您的真實姓名"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" formControlName="email" placeholder="例如: user@example.com"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out">
            </div>

            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">電話</label>
                <input type="tel" id="phone" formControlName="phone" placeholder="例如: 09xx-xxx-xxx"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out">
            </div>

            <button type="submit" [disabled]="userForm.invalid" class="w-full py-2.5 px-4 rounded-lg text-lg font-semibold text-white transition duration-200 ease-in-out 
                    bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-500 focus:ring-opacity-50
                    disabled:opacity-50 disabled:cursor-not-allowed mt-6">
                註冊使用者
            </button>
            <button type="button" routerLink="/" class="w-full py-2.5 px-4 rounded-lg text-lg font-semibold text-white transition duration-200 ease-in-out 
                    bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-4 focus:ring-blue-500 focus:ring-opacity-50
                    disabled:opacity-50 disabled:cursor-not-allowed mt-6">取消註冊</button>

        </form>

    </div>
</div>
