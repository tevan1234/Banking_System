<header class="text-gray-600 body-font h-16">
  <div class="container mx-auto flex items-center justify-between h-full px-3 relative">
    <!-- 左側 Logo -->
    <button (click)="router.navigate(['/'])"
      class="flex items-center justify-center focus:outline-none">
      <div class="w-10 h-10 flex items-center justify-center rounded-full bg-blue-500">
        <img src="assets/img/logo.svg" class="w-full h-full" alt="Logo">
      </div>
      <span class="ml-3 text-2xl font-bold text-gray-900">幸福銀行</span>
    </button>


    <!-- 中間歡迎文字 -->
    <div class="flex-1 text-center min-w-[120px]">
      <span class="text-xl font-medium text-gray-900 truncate">
        @if (authService.userName$ | async; as userName) {
          歡迎, {{ userName }}!
        }
      </span>
    </div>

    <!-- 右側 Drawer Toggle Button (桌面 + 手機) -->
    <button (click)="openDrawer()"
      class="inline-flex items-center bg-blue-500 text-white border-0 py-2 px-3 focus:outline-none hover:bg-blue-600 rounded text-base"
      type="button" aria-label="Toggle navigation">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
  </div>
</header>
