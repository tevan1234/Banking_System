@if (isDrawerOpen$ | async) {
<div (click)="closeDrawer()" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-40 transition-opacity duration-300"></div>
}

<aside
    class="fixed top-0 right-0 w-64 h-full bg-white shadow-xl z-50 transition-transform duration-300 ease-in-out transform"
    [ngClass]="{
    'translate-x-0': isDrawerOpen$ | async,
    'translate-x-full': !(isDrawerOpen$ | async)
    }">

    @if ({role: role$ | async}; as data) {
    <div class="p-4 overflow-y-auto h-full">
        <h2 class="text-xl font-bold mb-4 text-gray-800">導覽選單</h2>

        <nav class="space-y-2">
            <a routerLink="/login" class="flex items-center p-2 text-base font-normal text-gray-900 rounded-lg hover:bg-gray-100">
                <img src="assets/img/user.svg" class="w-6 h-6 text-gray-500 transition duration-75 group-hover:text-gray-900" fill="currentColor"
                    viewBox="0 0 20 20">
                    <span class="ml-3">註冊/登入</span>
            </a>

            <a href="/dashboard"
                class="flex items-center p-2 text-base font-normal text-gray-900 rounded-lg hover:bg-gray-100">
                <svg class="w-6 h-6 text-gray-500 transition duration-75 group-hover:text-gray-900" fill="currentColor"
                    viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 10a8 8 0 018-8v8h8a8 8 0 01-8 8v-8H2z"></path>
                    <path d="M12 2.25a8 8 0 00-2 15.58V10h-8a8 8 0 0115.74-2h-.01L12 2.25z"></path>
                </svg>
                <span class="ml-3">儀表板</span>
            </a>

            <a href="/profile"
                class="flex items-center p-2 text-base font-normal text-gray-900 rounded-lg hover:bg-gray-100">
                <svg class="flex-shrink-0 w-6 h-6 text-gray-500 transition duration-75 group-hover:text-gray-900"
                    fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
                        clip-rule="evenodd"></path>
                </svg>
                <span class="ml-3">個人資料</span>
            </a>

            <a href="/settings"
                class="flex items-center p-2 text-base font-normal text-gray-900 rounded-lg hover:bg-gray-100">
                <svg class="flex-shrink-0 w-6 h-6 text-gray-500 transition duration-75 group-hover:text-gray-900"
                    fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M17.293 13.593a1 1 0 00-1.077-.47l-1.442.721a1 1 0 01-1.105-.285l-.946-.946a1 1 0 00-.285-1.105l.721-1.442a1 1 0 00-.47-1.077l-4.502-1.29a1 1 0 00-1.12.285l-.946.946a1 1 0 01-1.105.285l-.946-.946a1 1 0 00-1.105-.285l-1.442.721a1 1 0 00-1.077-.47l-1.29-4.502a1 1 0 00-.285-1.12l-.946-.946a1 1 0 01-.285-1.105l.721-1.442a1 1 0 00-.47-1.077l-1.29-4.502a1 1 0 00-1.12-.285l-1.442.721a1 1 0 01-1.105-.285l-.946-.946a1 1 0 00-.285-1.105l-.721-1.442a1 1 0 00-.47-1.077L2.293 3.593A1 1 0 011 2.293l1.29-4.502a1 1 0 00-.285-1.12l-.946-.946a1 1 0 01-.285-1.105l-.721-1.442a1 1 0 00-.47-1.077l-1.29-4.502a1 1 0 00-1.12-.285L2.293 3.593a1 1 0 01-.285 1.105l-.721 1.442a1 1 0 00.47 1.077l1.29 4.502a1 1 0 001.12.285l.946-.946a1 1 0 011.105-.285l.721 1.442a1 1 0 00.47 1.077l4.502 1.29a1 1 0 001.12-.285l.946-.946a1 1 0 011.105-.285l.721 1.442a1 1 0 00.47 1.077l1.29 4.502a1 1 0 001.12.285L17.293 13.593z">
                    </path>
                </svg>
                <span class="ml-3">設定</span>
            </a>
        </nav>

        <hr class="my-4 border-gray-200" />

        <div>
            <button (click)="toggleDropdown('products')" type="button"
                class="flex items-center w-full p-2 text-base font-normal text-gray-900 transition duration-75 rounded-lg group hover:bg-gray-100"
                [attr.aria-expanded]="isDropdownOpen('products')">
                <svg class="flex-shrink-0 w-6 h-6 text-gray-500 transition duration-75 group-hover:text-gray-900"
                    fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd"
                        d="M10 2a8 8 0 00-8 8 8 8 0 0016 0 8 8 0 00-8-8zm0 14a6 6 0 110-12 6 6 0 010 12z"
                        clip-rule="evenodd"></path>
                    <path d="M12 9a1 1 0 00-1-1H9a1 1 0 100 2h2a1 1 0 001-1z"></path>
                </svg>
                <span class="flex-1 ml-3 text-left whitespace-nowrap">產品管理</span>
                <svg class="w-6 h-6 transition-transform" [ngClass]="{'rotate-180': isDropdownOpen('products')}"
                    fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd"
                        d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                        clip-rule="evenodd"></path>
                </svg>
            </button>

            @if (isDropdownOpen('products')) {
            <ul class="py-2 space-y-2 ml-4">
                <li>
                    <a href="/products/list"
                        class="flex items-center p-2 text-base font-normal text-gray-900 rounded-lg transition duration-75 hover:bg-gray-100 pl-8">產品列表</a>
                </li>

                @if (data.role === "Admin") {
                <li>
                    <a href="/products/add"
                        class="flex items-center p-2 text-base font-normal text-gray-900 rounded-lg transition duration-75 hover:bg-gray-100 pl-8">新增產品</a>
                </li>
                }

                <li>
                    <a href="/products/categories"
                        class="flex items-center p-2 text-base font-normal text-gray-900 rounded-lg transition duration-75 hover:bg-gray-100 pl-8">產品分類</a>
                </li>
            </ul>
            }

        </div>

        <hr class="my-4 border-gray-200" />

        <div>
            <button (click)="toggleDropdown('reports')" type="button"
                class="flex items-center w-full p-2 text-base font-normal text-gray-900 transition duration-75 rounded-lg group hover:bg-gray-100"
                [attr.aria-expanded]="isDropdownOpen('reports')">
                <svg class="flex-shrink-0 w-6 h-6 text-gray-500 transition duration-75 group-hover:text-gray-900"
                    fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
                    </path>
                </svg>
                <span class="flex-1 ml-3 text-left whitespace-nowrap">報告與分析</span>
                <svg class="w-6 h-6 transition-transform" [ngClass]="{'rotate-180': isDropdownOpen('reports')}"
                    fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd"
                        d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                        clip-rule="evenodd"></path>
                </svg>
            </button>

            @if(isDropdownOpen('reports')){
            <ul class="py-2 space-y-2 ml-4">
                <li>
                    <a href="/reports/sales"
                        class="flex items-center p-2 text-base font-normal text-gray-900 rounded-lg transition duration-75 hover:bg-gray-100 pl-8">銷售報告</a>
                </li>
                <li>
                    <a href="/reports/traffic"
                        class="flex items-center p-2 text-base font-normal text-gray-900 rounded-lg transition duration-75 hover:bg-gray-100 pl-8">網站流量</a>
                </li>
            </ul>
            }

        </div>

        @if (data.role != null) {
        <a (click)="logout()" class="flex items-center p-2 text-base font-normal text-red-600 rounded-lg hover:bg-red-50">
            <svg class="flex-shrink-0 w-6 h-6 text-red-500 transition duration-75 group-hover:text-red-700"
                fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd"
                    d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.586 7L9.293 6.707a1 1 0 010-1.414l3.293-3.293a1 1 0 011.414 1.414L11.414 9H17a1 1 0 010 2h-5.586l2.293 2.293a1 1 0 01-1.414 1.414L9.293 10.707a1 1 0 010-1.414z"
                    clip-rule="evenodd"></path>
            </svg>
            <span class="ml-3">登出</span>
        </a>
        }
    </div>
    }
</aside>
