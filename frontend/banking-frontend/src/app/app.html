<!-- app.component.html -->
<div class="flex flex-col min-h-screen">

    <!-- Header 固定 -->
    @if (showHeaderAndFooter()) {
        <app-header></app-header>
        <app-drawer></app-drawer>
    }

    <!-- 主要內容 -->
    @if (showHeaderAndFooter()) {
        <div class="pt-16 flex-grow bg-blue-200">
            <app-body></app-body>
            <router-outlet></router-outlet>
        </div>
    }@else {
        <div class="flex-grow">
            <app-body></app-body>
            <router-outlet></router-outlet>
        </div>
    }

    @if (showHeaderAndFooter()) {
        <app-footer></app-footer>
    }

</div>
